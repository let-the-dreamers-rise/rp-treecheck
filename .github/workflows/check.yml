name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily: picks up a new interval within a day of publication
  workflow_dispatch:
    inputs:
      interval:
        description: "interval to verify end to end (default: latest published)"
        required: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  verify-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m rptc.run ${{ github.event.inputs.interval }} | tee report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.txt
            reports/
